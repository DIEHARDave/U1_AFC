# U1_AFC bridge: keeps AFC lanes in step with loads and spool changes made on
# the U1 itself (screen, feeder buttons, RFID tags, SpoolLink).
# Installed to printer_data/config/AFC/ by U1_AFC's install.sh; AFC's
# [include AFC/*.cfg] loads it. Commands: AFC_BRIDGE_STATUS, AFC_BRIDGE_SYNC.
[u1_afc]
#sync_loads: True        # mark a lane loaded when its feeder finishes a load on the U1
#sync_spools: True       # take spool / material / color from the U1's print_task_config
#default_weight: 1000    # weight (g) for a loaded lane without a Spoolman spool
#poll_interval: 2        # seconds between checks (only while AFC is idle and not printing)
#start_delay: 10         # seconds after Klipper start before the first check
#settle_time: 5          # seconds the U1's values for a head must hold still before acting
                         # (a tag scan reports "no spool" for a moment)
#active_spool: spoollink # who sets Moonraker's active spool: spoollink (follows the head
                         # on the carriage; AFC's writes skipped while SpoolLink runs) or afc
